function calcStars(myLine, posted) {
  const lo=Math.min(myLine,posted), hi=Math.max(myLine,posted);

// -- O/U MODEL (matchup-average totals) --

const OU_WX={dome:1,hot:0,cold:-1.5,wind:-2.5};

function splitInjury(delta){
  let off=0,def=0;
  delta.details.forEach(d=>{
    const g=POS_GROUP[d.p]||"ST";
    if(g==="ST")return;
    if(OFF_GROUPS[g])off+=d.loss;else def+=d.loss;
  });
  return{off:parseFloat(off.toFixed(2)),def:parseFloat(def.toFixed(2))};
}
function calcModelTotal(hStats,aStats,hDelta,aDelta,gameWx){
  if(!hStats||!aStats)return null;
  const hi=splitInjury(hDelta),ai=splitInjury(aDelta);
  const hPts=(hStats.off+aStats.def)/2 - 0.5*hi.off + 0.5*ai.def;
  const aPts=(aStats.off+hStats.def)/2 - 0.5*ai.off + 0.5*hi.def;
  let wx=0;Object.keys(OU_WX).forEach(k=>{if(gameWx[k])wx+=OU_WX[k];});
  return{total:parseFloat((hPts+aPts+wx).toFixed(1)),hPts:parseFloat(hPts.toFixed(1)),aPts:parseFloat(aPts.toFixed(1)),wx};
}

// Compute a team's injury point delta from roster + statuses (Walters ch.22 method)
// qbMult scales QB-position losses (book-literal 1.0; market behaves closer to 2.0 -- Results calibrates it)
function calcInjuryDelta(roster,statuses,qbMult){
  const qm=qbMult||1;
  const groups={},details=[];let qbRaw=0;
  roster.forEach(pl=>{
    const st=statuses[pl.n]||"IN";
    if(st==="IN")return;
    let loss,repl=null;const val=x=>(x.ev!=null?x.ev:x.v);
    if(st==="OUT"){
      const r=roster.filter(x=>x.p===pl.p&&x.n!==pl.n&&(statuses[x.n]||"IN")!=="OUT"&&x.d>pl.d).sort((a,b)=>a.d-b.d)[0];
      const rv=r?val(r)*(1-(Q_PCT[statuses[r.n]]||0)):0;
      loss=Math.max(0,val(pl)-rv);repl=r?r.n:null;
    }else{
      const r=roster.filter(x=>x.p===pl.p&&x.n!==pl.n&&(statuses[x.n]||"IN")!=="OUT"&&x.d>pl.d).sort((a,b)=>a.d-b.d)[0];
      const rv=r?val(r)*(1-(Q_PCT[statuses[r.n]]||0)):0;
      loss=(Q_PCT[st]||0)*Math.max(0,val(pl)-rv);repl=r?r.n:null;
    }
    if(pl.p==="QB"){qbRaw+=loss;loss=loss*qm;}
    details.push({n:pl.n,p:pl.p,st,loss:parseFloat(loss.toFixed(2)),repl});
    const g=POS_GROUP[pl.p]||"OTHER";
    (groups[g]=groups[g]||[]).push(loss);
  });
  let total=0;const stacked=[];
  Object.entries(groups).forEach(([g,losses])=>{
    const sum=losses.reduce((a,b)=>a+b,0);
    const mult=losses.length>=2?(STACK_MULT[g]||1.3):1;
    if(mult>1&&sum>0)stacked.push(g);
    total+=sum*mult;
  });
  const qb=parseFloat(qbRaw.toFixed(2));
  return {total:parseFloat(total.toFixed(2)),details,stacked,qb,other:parseFloat((total-qb*qm).toFixed(2))};
}

function wilson(w,n){

  const z=1.96,p=w/n,d=1+z*z/n,c=p+z*z/(2*n),s=z*Math.sqrt((p*(1-p)+z*z/(4*n))/n);
  return[Math.max(0,(c-s)/d*100),Math.min(100,(c+s)/d*100)];
}
function nameReport(raw,keyFn){
  const dropped=[];const matched=[];
  raw.forEach(x=>{const k=keyFn(x);if(k.every(t=>t in DEFAULT_RATINGS))matched.push(x);else dropped.push(k.filter(t=>!(t in DEFAULT_RATINGS)).join("/"));});
  return{matched,dropped};
}
function computeCalibration(slates,history,prev){
  const c={...CALIB_DEFAULT,on:prev?prev.on:true};
  // HFA: all graded slate games, margin vs model line
  const errs=[];
  (slates||[]).forEach(s=>(s.games||[]).forEach(g=>{if(g.hs!=null&&g.modelLine!=null&&!g.neutral)errs.push((g.hs-g.as)-g.modelLine);}));
  if(errs.length){const b=errs.reduce((a,x)=>a+x,0)/errs.length;c.nHfa=errs.length;c.hfaAdj=parseFloat((b*errs.length/(errs.length+CALIB_PRIOR_N)).toFixed(2));}
  // information coefficient: slope of (margin-close) on (model-close) over slate games with closing lines
  const xs=[],ys=[];
  (slates||[]).forEach(s=>(s.games||[]).forEach(g=>{if(g.hs!=null&&g.close!=null&&g.modelLine!=null){xs.push(g.modelLine-g.close);ys.push((g.hs-g.as)-g.close);}}));
  if(xs.length>=8){const mx=xs.reduce((a,x)=>a+x,0)/xs.length,my=ys.reduce((a,x)=>a+x,0)/ys.length;let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)*(x-mx);});c.ic=sxx?parseFloat((sxy/sxx).toFixed(3)):null;c.nIc=xs.length;}
  // O/U scalar: graded analyzed games with a model total
  let at=0,mt=0,n=0;
  (history||[]).forEach(b=>{if(b.hs!=null&&b.modelOU){at+=b.hs+b.as;mt+=b.modelOU;n++;}});
  if(n&&mt>0){const r=at/mt;c.nOu=n;c.ouScalar=parseFloat((1+(r-1)*n/(n+CALIB_PRIOR_N)).toFixed(3));}
  // QB multiplier: graded analyzed games with QB injury value; pick m minimizing squared error
  const qg=(history||[]).filter(b=>b.hs!=null&&b.game&&b.game.baseLine!=null&&((b.game.hQb||0)+(b.game.aQb||0))>0);
  c.nQb=qg.length;
  if(qg.length>=5){
    let best=1,bestE=Infinity;
    [1,1.5,2,2.5,3].forEach(m=>{
      const e=qg.reduce((a,b)=>{const g=b.game;const line=g.baseLine-((g.hQb||0)*m+(g.hOther||0))+((g.aQb||0)*m+(g.aOther||0));return a+Math.pow((b.hs-b.as)-line,2);},0);
      if(e<bestE){bestE=e;best=m;}
    });
    c.qbMult=best;
  }
  return c;
}
async function claudeSearchJSON(prompt,maxTokens,arrayMode){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:prompt}]})});
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||"API error");
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const m=txt.match(arrayMode?/\[[\s\S]*\]/:/\{[\s\S]*\}/);
  if(!m)throw new Error("No JSON in response");
  return JSON.parse(m[0]);
}
async function fetchScheduleAPI(wk){
  const raw=await claudeSearchJSON("Search the web for the official 2026 NFL regular season schedule for Week "+wk+". Return ONLY a raw JSON array, no markdown, one entry per game: [{\"away\":\"Full Team Name\",\"home\":\"Full Team Name\",\"day\":\"Sun Sep 13\",\"time\":\"1:00 PM ET\",\"net\":\"CBS\"}]. Use full official team names. Include every game that week (usually 13-16 games).",2500,true);
  const norm=raw.map(x=>({away:normTeam(x.away||""),home:normTeam(x.home||""),day:x.day||"",time:x.time||"",net:x.net||""}));
  const rep=nameReport(norm,x=>[x.home,x.away]);
  return{games:rep.matched,dropped:rep.dropped};
}
async function fetchFinalsAPI(pairs){
  const list=pairs.map(p=>p.away+" at "+p.home).join("; ");

  const norm=raw.filter(s=>s.final&&s.homeScore!=null&&s.awayScore!=null).map(s=>({home:normTeam(s.home||""),away:normTeam(s.away||""),hs:parseInt(s.homeScore),as:parseInt(s.awayScore)}));
  const rep=nameReport(norm,x=>[x.home,x.away]);

}

// -- PLAYER DATA LAYER (import from player_pipeline.py: nflverse/PFR or PFF export) --
// Tests 2018-25: pass rush vs protection is ADDITIVE (no matchup term; both sides already in ratings);
// individual and unit DL ratings predict equally (use unit + individual availability); OL continuity effect
// is small; QB individual value ~1.1-1.9 pts of spread per SD; bottom-up ratings alone are WORSE than
// top-down (RMSE 13.2 vs 12.7); as a layer on top-down they add ~0.03 RMSE. Value of this layer is
// availability, PFF import, and QB tracking -- not a better base rating.
const PERF_ALPHA=0.25;   // effective value = base x (1 + alpha x idx), clamped
const QB_BOOK_AVG=7.74,QB_PTS_PER_SD=0.85;   // book QB scale: avg 7.74; ~0.85 book-points per SD of QB EPA/dropback
function loadPlayerData(){try{return JSON.parse(localStorage.getItem("wplayers"))||null;}catch{return null;}}
function savePlayerData(d){try{localStorage.setItem("wplayers",JSON.stringify(d));}catch{}}
function nameKey(n){const s=(n||"").toLowerCase().replace(/[^a-z .]/g,"").replace(/\b(jr|sr|ii|iii|iv)\b/g,"").trim();const parts=s.split(/[ .]+/).filter(Boolean);if(!parts.length)return"";return parts[0][0]+"|"+parts[parts.length-1];}
function findPerf(list,name){
  if(!list||!list.length)return null;
  const lc=(name||"").toLowerCase();
  let hit=list.find(p=>(p.n||"").toLowerCase()===lc);
  if(!hit){const k=nameKey(name);hit=list.find(p=>nameKey(p.n)===k);}
  if(!hit){const last=nameKey(name).split("|")[1];const c=list.filter(p=>nameKey(p.n).split("|")[1]===last);if(c.length===1)hit=c[0];}   // nicknames: unique last name on the team
  return hit||null;
}
function attachPerf(roster,team,pd){
  const list=pd&&pd.players&&pd.players[team];
  return roster.map(pl=>{
    const h=findPerf(list,pl.n);
    if(!h)return{...pl,ev:pl.v,idx:null};
    // QB values sit on the absolute book scale (6.0-9.5): blend seed judgment with the data value, never multiply
    if(pl.p==="QB")return{...pl,idx:h.idx,smp:h.smp,ev:h.smp>=60?parseFloat(((pl.v+qbValueFromIdx(h.idx))/2).toFixed(2)):pl.v};
    const mult=Math.min(2,Math.max(0.2,1+PERF_ALPHA*h.idx));
    return{...pl,idx:h.idx,smp:h.smp,src:h.src,ev:parseFloat((pl.v*mult).toFixed(2))};
  });
}
function qbValueFromIdx(idx){return parseFloat(Math.min(9.5,Math.max(5.0,QB_BOOK_AVG+QB_PTS_PER_SD*idx)).toFixed(1));}
// bottom-up team rating from player data alone (predictive weights, 2018-25): QB idx 3.48 pts/SD, rush R 41.9, protection P -22.6; rescaled to SD 2.6
function buildBottomUp(pd){
  if(!pd||!pd.units)return null;
  const raw={};
  Object.keys(DEFAULT_RATINGS).forEach(t=>{
    const u=pd.units[t]||{};const qbs=(pd.players&&pd.players[t]||[]).filter(p=>p.p==="QB").sort((a,b)=>b.smp-a.smp);
    const qbz=qbs.length?qbs[0].idx:0;
    raw[t]=3.48*qbz+41.9*(u.R||0)-22.6*(u.P||0);
  });
  const vals=Object.values(raw);const m=vals.reduce((a,b)=>a+b,0)/vals.length;const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-m)*(b-m),0)/vals.length)||1;
  const out={};Object.keys(raw).forEach(t=>{out[t]=parseFloat(((raw[t]-m)/sd*2.6).toFixed(2));});
  return out;
}

// -- SHARED LINE FETCHER: Odds API direct when a key exists (per-book), else Claude web search. Home-margin convention. --
async function fetchRawLines(){
  const oKey=typeof localStorage!=="undefined"?localStorage.getItem("oapi"):null;
  if(oKey){
    try{
      const r=await fetch("https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey="+oKey+"&regions=us&markets=spreads,totals&oddsFormat=american&bookmakers=draftkings,fanduel,caesars,betmgm");
      if(r.ok){
        const d=await r.json();
        const lines=d.map(g=>{
          const home=normTeam(g.home_team),away=normTeam(g.away_team);
          const sp=[],byBook={},tots=[];
          (g.bookmakers||[]).forEach(bk=>{
            const sm=(bk.markets||[]).find(x=>x.key==="spreads");
            // Odds API home point is negative when home favored; app convention is positive = home favored
            if(sm){const o=(sm.outcomes||[]).find(x=>normTeam(x.name)===home);if(o&&o.point!=null){const v=-o.point;sp.push(v);byBook[bk.title]=v;}}
            const tm=(bk.markets||[]).find(x=>x.key==="totals");
            if(tm){const o=(tm.outcomes||[]).find(x=>x.name==="Over");if(o&&o.point!=null)tots.push(o.point);}
          });
          const dt=new Date(g.commence_time);
          return{home,away,posted:sp.length?parseFloat((sp.reduce((a,b)=>a+b,0)/sp.length).toFixed(1)):null,ou:tots.length?parseFloat((tots.reduce((a,b)=>a+b,0)/tots.length).toFixed(1)):null,byBook,day:dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),time:dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),ts:dt.getTime()};
        }).filter(g=>g.home in DEFAULT_RATINGS&&g.away in DEFAULT_RATINGS&&g.posted!=null&&g.ts>Date.now()-6*3600*1000);
        // the feed carries look-ahead lines for the whole season: keep only the next slate (earliest upcoming kickoff + 7 days)
        const t0=lines.length?Math.min(...lines.map(g=>g.ts)):0;
        const slate=lines.filter(g=>g.ts<t0+7*24*3600*1000);
        if(slate.length)return{lines:slate,dropped:[],source:"odds"};
      }
    }catch(e){/* sandbox CORS or bad key -- fall through to web search */}
  }
  const raw=await claudeSearchJSON("Search the web for current NFL point spreads and totals (over/under) for all upcoming games this week (2026 season). Use a major sportsbook or consensus lines. Return ONLY a raw JSON array, no markdown: [{\"away\":\"Full Team Name\",\"home\":\"Full Team Name\",\"spread\":-3.5,\"ou\":44.5,\"day\":\"Sun Sep 6\",\"time\":\"1:00 PM ET\"}]. IMPORTANT spread convention: spread is how many points the HOME team is favored by (positive = home favored, negative = home underdog). Example: if the home team is a 3-point favorite, spread is 3. If the away team is favored by 2.5, spread is -2.5. Include every scheduled game you can find with both a spread and a total.",3000,true);
  const rep=nameReport(raw.map(g=>({home:normTeam(g.home||""),away:normTeam(g.away||""),posted:g.spread!=null?parseFloat(g.spread):null,ou:g.ou!=null?parseFloat(g.ou):null,byBook:{},day:g.day||"",time:g.time||""})),x=>[x.home,x.away]);
  return{lines:rep.matched.filter(g=>g.posted!=null),dropped:rep.dropped,source:"search"};
}
// per-week line snapshots: first sighting = open, latest sighting = close
function persistLines(lines,wk){
  try{
    const key="wlines26_"+(wk||currentNflWeek());
    const cur=JSON.parse(localStorage.getItem(key)||"{}");
    lines.forEach(g=>{const k=g.home+"|"+g.away;const prev=cur[k]||{};cur[k]={open:prev.open!=null?prev.open:g.posted,openOu:prev.openOu!=null?prev.openOu:g.ou,posted:g.posted,ou:g.ou,ts:Date.now()};});
    localStorage.setItem(key,JSON.stringify(cur));
  }catch{}
}
// closing line value from the bettor's side, in points (positive = market moved toward you)
function clvOf(side,posted,close){
  if(side==null||posted==null||close==null)return null;
  return parseFloat(((close-posted)*(side==="home"?1:-1)).toFixed(1));
}
function clvOuOf(take,posted,close){
  if(!take||posted==null||close==null)return null;
  const t=take.toUpperCase();if(t!=="OVER"&&t!=="UNDER")return null;
  return parseFloat(((close-posted)*(t==="OVER"?1:-1)).toFixed(1));
}

  const[err,setErr]=useState(null);
  const[fetched,setFetched]=useState(null);
  const[min,setMin]=useState(0.5);
  const[dropped,setDropped]=useState([]);
  const hfa=hfaOf(calib);
  const buildGame=(g,i)=>{
    const hr=ratings[g.home],ar=ratings[g.away];
    const myLine=hr!=null&&ar!=null?parseFloat(((hr+hfa)-ar).toFixed(2)):null;
    const{stars,pct}=myLine!=null&&g.posted!=null?calcStars(myLine,g.posted):{stars:0,pct:"0"};

  };

  const fetch_=useCallback(async()=>{
    if(loading)return;setLoading(true);setErr(null);
    try{

          </div>
          <button style={{...St.sm,color:"#E04500",borderColor:"#E0450030",background:"#FB4F1411",padding:"10px 20px",fontSize:11}} onClick={fetch_} disabled={loading}>{loading?"SEARCHING...":"FETCH LIVE LINES"}</button>

        {fetched&&<div style={{color:"#7A8E9A",fontSize:11,marginTop:6}}>Last fetch: {fetched}{calib&&calib.on&&calib.hfaAdj?" -- HFA "+hfa.toFixed(2)+" (calibrated)":""}</div>}
        {dropped.length>0&&<div style={{color:"#C0392B",fontSize:10,marginTop:4,fontFamily:"Space Mono,monospace"}}>DROPPED {dropped.length} (unrecognized): {dropped.join(", ")}</div>}
      </div>

      {games.length>0&&(
        <div style={{margin:"10px 20px 0",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{color:"#7A8E9A",fontSize:10,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>MIN STARS:</span>
          {[0,0.5,1,1.5,2,2.5].map(s=>(
            <button key={s} onClick={()=>setMin(s)} style={{...St.sm,padding:"4px 10px",color:min===s?"#E04500":"#7A8E9A",borderColor:min===s?"#E04500":"#C8C0B0",background:min===s?"#D4AF3311":"transparent"}}>
              {s===0?"ALL":s+" star"}
            </button>
          ))}
          <span style={{color:"#7A8E9A",fontSize:11,marginLeft:"auto"}}>{qual.length} plays -- {games.length} games</span>
        </div>
      )}

      {qual.length>0&&<><H2>QUALIFYING PLAYS -- {qual.length}</H2>{qual.map(g=><AlertCard key={g.id} g={g} onPick={onPick}/>)}</>}
      {none.length>0&&(
        <><H2>NO EDGE -- {none.length} GAMES</H2>
        <div style={{margin:"8px 20px 0",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:6}}>

const GROUP_ORDER=["QB","RB","REC","OL","DL","LB","DB","ST"];
const GROUP_LABEL={QB:"QUARTERBACKS",RB:"RUNNING BACKS",REC:"RECEIVERS (WR/TE)",OL:"OFFENSIVE LINE",DL:"DEFENSIVE LINE / EDGE",LB:"LINEBACKERS",DB:"SECONDARY",ST:"SPECIALISTS"};

function loadRosterCache(team){
  try{const raw=localStorage.getItem("wroster_"+(ABBR[team]||team));if(!raw)return null;return JSON.parse(raw);}catch{return null;}
}
function saveRosterCache(team,players){
  try{localStorage.setItem("wroster_"+(ABBR[team]||team),JSON.stringify({ts:Date.now(),players}));}catch{}
}

async function fetchRosterAPI(team){
  const pr="Search the web for the "+team+" current 53-man roster for the 2026 NFL season (final roster after August 2026 cuts). Find every player and their role. Return ONLY a raw JSON array, no markdown, no explanation: [{\"n\":\"Full Name\",\"p\":\"POS\",\"v\":0.0,\"d\":1}] where p is exactly one of QB,RB,FB,WR,TE,OT,G,C,EDGE,DT,LB,CB,S,K,P,LS and d is depth order at that position (1=starter, 2=primary backup, etc). v is the player's Billy Walters point value on the NFL spread using this exact calibration: starting QBs 6.0-9.5 (elite 9.0+, average 7.5-8.0, weak 6.0-7.0); backup QBs 4.5-7.0; elite non-QB superstars 2.0-3.0 (e.g. a game-wrecking edge rusher is 2.5); Pro Bowl caliber starters 1.2-2.0 (an elite OT is about 1.3); solid starters 0.5-1.2; rotational players 0.2-0.5; backups 0.1-0.3; deep depth and most special teamers 0.0-0.1. Judge each value on the player's current 2026 ability and importance to this specific team. Include ALL roster players, about 53.";
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:6000,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:pr}]})});
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||"API error");
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const m=txt.match(/\[[\s\S]*\]/);
  if(!m)throw new Error("No roster JSON in response");
  const players=JSON.parse(m[0]).filter(p=>p.n&&p.p);
  players.forEach(p=>{p.v=parseFloat(p.v)||0;p.d=parseInt(p.d)||9;});
  return players;
}

async function fetchPracticeAPI(away,home){
  const pr="Search the web for the official NFL injury report and Wednesday-Friday practice participation for the upcoming "+away+" at "+home+" game (2026 season). Return ONLY raw JSON, no markdown: {\"away\":[{\"n\":\"Player Name\",\"p\":\"POS\",\"status\":\"Out\"|\"Doubtful\"|\"Questionable\",\"practice\":\"DNP\"|\"LP\"|\"FP\"}],\"home\":[...]}. practice = most recent practice participation (DNP=did not practice, LP=limited, FP=full). Include every player on the report, including those with no game designation (status null) but a practice entry. If no report is available yet return {\"away\":[],\"home\":[]}.";
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2500,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:pr}]})});
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||"API error");
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("No injury report JSON in response");
  return JSON.parse(m[0]);
}

// calibrated on 2015-25 reports: Doubtful plays 1-2% of the time (= OUT); Questionable by last practice; no-tag DNP still costs ~12%
function suggestStatus(status,practice,pos){
  if(status==="Out"||status==="Doubtful")return "OUT";
  if(status==="Questionable"){
    if(practice==="DNP")return "Q55";
    if(practice==="LP")return pos==="QB"?"Q55":"Q30";
    return "Q15";
  }
  if(practice==="DNP")return "Q15";
  return "IN";
}

// -- ANALYZE TAB --
function AnalyzeTab({ratings,bankroll,unit,onLog,prefill,calib,qbMode,setQbMode}){
  const[neutral,setNeutral]=useState(false);
  const hfa=neutral?0:hfaOf(calib);
  const qbMult=qbMode==="AUTO"?((calib&&calib.nQb>=5)?calib.qbMult:1):parseFloat(qbMode||"1");
  const[form,setForm]=useState({home:"",away:"",spread:"",ou:"",myLine:"",weather:"",hInj:"",aInj:"",notes:"",adjH:0,adjA:0});
  const[sweOn,setSweOn]=useState({});
  const[manual,setManual]=useState(false);
  const[result,setResult]=useState(null);
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState(null);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  // -- roster / player-value state --
  const[rosters,setRosters]=useState({});           // team -> [{n,p,v,d}]
  const[rosterTs,setRosterTs]=useState({});          // team -> cache timestamp
  const[statuses,setStatuses]=useState({});          // team -> {playerName: status}
  const[fetchingR,setFetchingR]=useState({});        // team -> bool
  const[gameWx,setGameWx]=useState({});              // {dome,hot,cold,wind} toggles
  const[practiceLoading,setPracticeLoading]=useState(false);
  const[practiceRpt,setPracticeRpt]=useState(null);
  const[rosterErr,setRosterErr]=useState(null);

  const[playerData,setPlayerData]=useState(()=>loadPlayerData());
  const[pdOpen,setPdOpen]=useState(false);
  const[pdText,setPdText]=useState("");
  const[pdMsg,setPdMsg]=useState(null);
  const importPlayerData=()=>{
    try{
      const j=JSON.parse(pdText);
      if(!j.players)throw new Error("missing players");
      const n=Object.values(j.players).reduce((a,l)=>a+l.length,0);
      savePlayerData(j);setPlayerData(j);setPdOpen(false);setPdText("");
      setPdMsg("Loaded "+n+" players ("+(j.source||"import")+", through week "+(j.through_week||"?")+")");
    }catch(e){setPdMsg("Import failed: "+e.message);}
  };
  const[teamStats,setTeamStats]=useState({});
  const[statsLoading,setStatsLoading]=useState(false);
  const getRoster=useCallback((team)=>{
    if(!team)return[];
    let base=rosters[team];
    if(!base){const c=loadRosterCache(team);base=(c&&c.players)?c.players:seedRoster(team);}
    return attachPerf(base,team,playerData);
  },[rosters,playerData]);
  // sync QB values from the data index (book scale: 7.74 avg, 0.85 pts per SD)
  const syncQb=(team)=>{
    if(!team||!playerData)return;
    const base=rosters[team]||(loadRosterCache(team)||{}).players||seedRoster(team);
    const list=playerData.players&&playerData.players[team];
    const next=base.map(p=>{if(p.p!=="QB")return p;const h=findPerf(list,p.n);return h&&h.smp>=60?{...p,v:qbValueFromIdx(h.idx),synced:true}:p;});
    setRosters(r=>({...r,[team]:next}));setManual(false);
  };

  // hydrate cache ts on team pick
  useEffect(()=>{
    [form.home,form.away].forEach(t=>{
      if(!t)return;
      if(!rosters[t]){
        const c=loadRosterCache(t);
        if(c&&c.players){setRosters(r=>({...r,[t]:c.players}));setRosterTs(ts=>({...ts,[t]:c.ts}));}
      }
      if(!teamStats[t]){
        const sc=loadStatsCache(t);
        if(sc)setTeamStats(s=>({...s,[t]:sc}));
      }
    });
  },[form.home,form.away,rosters,teamStats]);

  const doFetchRoster=async(team)=>{
    if(!team||fetchingR[team])return;
    setFetchingR(f=>({...f,[team]:true}));setRosterErr(null);
    try{
      const players=await fetchRosterAPI(team);
      setRosters(r=>({...r,[team]:players}));
      setRosterTs(ts=>({...ts,[team]:Date.now()}));
      saveRosterCache(team,players);
    }catch(e){setRosterErr(team+": "+e.message);}
    finally{setFetchingR(f=>({...f,[team]:false}));}
  };

  const setPlayerStatus=(team)=>(name,st)=>{
    setStatuses(s=>({...s,[team]:{...(s[team]||{}),[name]:st}}));
    setManual(false);
  };

  const doStats=async()=>{
    if(!form.home||!form.away||statsLoading)return;
    setStatsLoading(true);setRosterErr(null);
    try{
      const hC=loadStatsCache(form.home),aC=loadStatsCache(form.away);
      if(hC&&aC){setTeamStats(s=>({...s,[form.home]:hC,[form.away]:aC}));}
      else{
        const r=await fetchTeamStatsAPI(form.away,form.home);
        setTeamStats(s=>({...s,[form.home]:r.home,[form.away]:r.away}));
        saveStatsCache(form.home,r.home);saveStatsCache(form.away,r.away);
      }
    }catch(e){setRosterErr("Team stats: "+e.message);}
    finally{setStatsLoading(false);}
  };

  const doPractice=async()=>{
    if(!form.home||!form.away||practiceLoading)return;
    setPracticeLoading(true);setRosterErr(null);setPracticeRpt(null);
    try{
      const rpt=await fetchPracticeAPI(form.away,form.home);
      setPracticeRpt(rpt);
    }catch(e){setRosterErr("Practice report: "+e.message);}
    finally{setPracticeLoading(false);}
  };

  const applyPractice=()=>{
    if(!practiceRpt)return;
    const apply=(team,list)=>{
      const roster=getRoster(team);
      const upd={};
      (list||[]).forEach(item=>{
        const match=roster.find(p=>p.n.toLowerCase()===item.n.toLowerCase()||p.n.toLowerCase().includes(item.n.toLowerCase())||item.n.toLowerCase().includes(p.n.toLowerCase()));
        if(match)upd[match.n]=suggestStatus(item.status,item.practice,match.p||item.p);
      });
      if(Object.keys(upd).length)setStatuses(s=>({...s,[team]:{...(s[team]||{}),...upd}}));
    };
    apply(form.away,practiceRpt.away);
    apply(form.home,practiceRpt.home);
    setManual(false);
  };

  useEffect(()=>{
    if(!prefill)return;
    setForm(f=>({...f,home:prefill.home||"",away:prefill.away||"",spread:prefill.posted!=null?String(prefill.posted):"",ou:prefill.postedOU!=null?String(prefill.postedOU):""}));
    setManual(false);setResult(null);
  },[prefill]);

  const hr=ratings[form.home],ar=ratings[form.away];
  const hRoster=getRoster(form.home),aRoster=getRoster(form.away);
  const hDelta=calcInjuryDelta(hRoster,statuses[form.home]||{},qbMult);
  const aDelta=calcInjuryDelta(aRoster,statuses[form.away]||{},qbMult);
  // per-QB weather W-factors, 0.15 pts each (book ch.22)
  const qbWxOf=(team)=>{
    const s=QB_SEED[team];if(!s||!s.qb1.wx)return 0;
    let w=0;const x=s.qb1.wx;
    if(gameWx.dome&&x.dome)w+=x.dome;
    if(gameWx.hot&&x.hot)w+=x.hot;
    if(gameWx.cold&&x.cold)w+=x.cold;
    if(gameWx.wind&&x.wind)w+=x.wind;
    return w*0.15;
  };
  const qbWxAdj=parseFloat((qbWxOf(form.home)-qbWxOf(form.away)).toFixed(2));
  const autoLine=hr!=null&&ar!=null?parseFloat(((hr+hfa)-ar+Number(form.adjH)-Number(form.adjA)-hDelta.total+aDelta.total+qbWxAdj).toFixed(2)):null;
  const modelOU0=calcModelTotal(teamStats[form.home],teamStats[form.away],hDelta,aDelta,gameWx);
  const ouScalar=(calib&&calib.on)?(calib.ouScalar||1):1;
  const modelOU=modelOU0?{...modelOU0,raw:modelOU0.total,total:parseFloat((modelOU0.total*ouScalar).toFixed(1))}:null;

  const ouLean=ouEdge==null?null:ouEdge>=4?"STRONG OVER":ouEdge>=2.5?"OVER":ouEdge<=-4?"STRONG UNDER":ouEdge<=-2.5?"UNDER":"NO EDGE";
  const myL=manual?parseFloat(form.myLine):(autoLine??NaN);
  const spL=parseFloat(form.spread);
  const ouL=parseFloat(form.ou);

  // "team" factors were hard-wired to the visitor and "variable" resolved to 0.
  // sweOn now stores "h" or "a" so you pick which side each one benefits.
  const sweAdj=Object.entries(sweOn).reduce((sum,[id,side])=>{
    if(!side)return sum;
    const f=SWE.find(x=>x.id===id);if(!f)return sum;
    const mul=f.ben==="home"?1:f.ben==="visitor"?-1:(side==="h"?1:-1);
    return sum+(f.pts*mul/5);
  },0);
  const adjLine=!isNaN(myL)?parseFloat((myL+sweAdj).toFixed(2)):NaN;
  const{stars,pct}=(!isNaN(adjLine)&&!isNaN(spL))?calcStars(adjLine,spL):{stars:0,pct:"0"};
  const ec=stars>=2?"#1A6E3C":stars>=1?"#E04500":"#7ABAE5";

  const run=async()=>{
    setLoading(true);setErr(null);setResult(null);
    try{
      const g={...form,spread:spL,myLine:myL,sweAdj:parseFloat(sweAdj.toFixed(2)),adjLine,stars,pct};
      const ouSection=!isNaN(ouL)?"POSTED O/U: "+ouL+"\nNotes: analyze whether the total looks high or low given team styles and weather.":"O/U: not provided";
      const injLine=(lbl,dl)=>{
        if(!dl.details.length)return lbl+" roster: full strength";
        const items=dl.details.map(d=>d.n+" ("+d.p+") "+d.st+(d.repl?" repl by "+d.repl:"")+" -"+d.loss+"pts").join("; ");
        return lbl+" roster delta: -"+dl.total+" pts ["+items+"]"+(dl.stacked.length?" STACK MULT applied: "+dl.stacked.join(","):"");
      };
      const matchupSection=(playerData&&playerData.units&&playerData.units[form.home]&&playerData.units[form.away])?(()=>{const lg=playerData.league_pressure_rate||0.247;const hu=playerData.units[form.home],au=playerData.units[form.away];return "\nMatchup (additive, already in ratings): expected pressure on HOME QB "+((lg+(au.R||0)+(hu.P||0))*100).toFixed(0)+"% vs league "+(lg*100).toFixed(0)+"%; on AWAY QB "+((lg+(hu.R||0)+(au.P||0))*100).toFixed(0)+"%";})():"";
      const rosterSection=injLine("HOME",hDelta)+"\n"+injLine("AWAY",aDelta)+matchupSection+(qbWxAdj!==0?"\nQB weather adj: "+(qbWxAdj>0?"+":"")+qbWxAdj+" pts (home perspective)":"")+(modelOU?"\nO/U model total: "+modelOU.total+(ouLean&&ouLean!=="NO EDGE"?" (model lean: "+ouLean+")":""):"");
      const pr="You are an NFL betting analyst using the Billy Walters system. Return ONLY valid JSON, no markdown.\nGAME: "+g.away+" @ "+g.home+"\nPosted: "+(spL>0?g.home+" -"+spL:g.away+" -"+Math.abs(spL))+"\nMy line: "+myL+" | SWE adj: "+sweAdj.toFixed(2)+" | Adjusted: "+adjLine+"\nStars: "+stars+" ("+pct+"%)\n"+rosterSection+"\nExtra home inj notes: "+(g.hInj||"none")+" | Extra away inj notes: "+(g.aInj||"none")+"\nWeather: "+(g.weather||"unknown")+" | Notes: "+(g.notes||"none")+"\n"+ouSection+"\nBankroll: $"+bankroll+" | Unit: $"+unit+"\nReturn: {\"recommendation\":\"FADE HOME\"|\"TAKE HOME\"|\"FADE AWAY\"|\"TAKE AWAY\"|\"NO BET\",\"confidence\":\"HIGH\"|\"MEDIUM\"|\"LOW\",\"edgeAnalysis\":\"2-3 sentences\",\"keyFactors\":[\"f1\",\"f2\",\"f3\"],\"injuryImpact\":\"brief\",\"lineAdvice\":\"timing and why\",\"suggestedBetSize\":number,\"warningFlags\":[\"flag\"],\"ou_take\":\"OVER\"|\"UNDER\"|\"NO BET\",\"ou_reasoning\":\"1-2 sentences on the total\"}";
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1100,messages:[{role:"user",content:pr}]})});
      const data=await res.json();
      const raw=data.content?.find(b=>b.type==="text")?.text||"{}";
      const r=JSON.parse(raw.replace(/```json|```/g,"").trim());
      r.suggestedBetSize=Math.round((r.suggestedBetSize||(stars>=1?unit*stars:0))/50)*50;
      setResult({...r,game:g});
      // auto-log every analysis (NO BET included, for formula accuracy); upserts by matchup
      const isNoBet=/NO BET/i.test(r.recommendation||"");
      const mechSide=stars>=0.5?(adjLine>spL?"home":adjLine<spL?"away":null):null;
      onLog({
        game:{...g,hInjPts:hDelta.total,aInjPts:aDelta.total,
          baseLine:parseFloat((adjLine+hDelta.total-aDelta.total).toFixed(2)),
          hQb:hDelta.qb,hOther:hDelta.other,aQb:aDelta.qb,aOther:aDelta.other,qbMult},
        mech:{side:mechSide,stars,line:adjLine,posted:spL},
        result:r,
        betSize:isNoBet?0:r.suggestedBetSize,
        ouRec:r.ou_take,
        modelOU:modelOU?modelOU.total:null,
        outcome:null,ouOutcome:null,hs:null,as:null,ratingApplied:false,
        ts:Date.now()
      });
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };

  return(
    <div style={{paddingBottom:40}}>
      <div style={{margin:"16px 20px 0",background:"#FFFFFF",border:"1px solid #FB4F1422",borderRadius:4,padding:"20px"}}>
        <div style={{color:"#3A6A85",fontSize:9,letterSpacing:5,fontFamily:"Space Mono,monospace",marginBottom:16}}>GAME SETUP</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          {[["away","AWAY TEAM"],["home","HOME TEAM"]].map(([k,lbl])=>(
            <div key={k}>
              <div style={St.lbl}>{lbl}</div>
              <select style={St.sel} value={form[k]} onChange={e=>{set(k,e.target.value);setManual(false);}}>
                <option value="">Select...</option>
                {Object.keys(ratings).sort().map(t=><option key={t} value={t}>{t} ({ratings[t]>=0?"+":""}{ratings[t]})</option>)}

            </div>

        </div>

        {form.home&&form.away&&hr!=null&&ar!=null&&(

              <div key={t} style={{display:"flex",justifyContent:"space-between",padding:"3px 0"}}>
                <span style={{color:"#3A6A85",fontSize:12}}>{t}{ih&&<span style={{color:"#7A8E9A",fontSize:10}}> +{hfa.toFixed(2)} HFA</span>}{dl.total>0&&<span style={{color:"#C0392B",fontSize:10,fontFamily:"Space Mono,monospace"}}> INJ -{dl.total}</span>}</span>
                <span style={{color:"#E04500",fontFamily:"Space Mono,monospace",fontSize:13,fontWeight:700}}>{(ih?r+hfa:r)>=0?"+":""}{ih?(r+hfa).toFixed(2):r}</span>

            </div>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:8}}>

              <div style={{display:"flex",gap:4,alignItems:"center"}}>

              </div>
              <div style={{display:"flex",gap:6}}>

            {practiceRpt&&((practiceRpt.away||[]).length+(practiceRpt.home||[]).length)===0&&(

            <RosterPanel team={form.away} roster={aRoster} statuses={statuses[form.away]||{}} onStatus={setPlayerStatus(form.away)} onFetch={()=>doFetchRoster(form.away)} fetching={!!fetchingR[form.away]} delta={aDelta} cacheTs={rosterTs[form.away]}/>
            <RosterPanel team={form.home} roster={hRoster} statuses={statuses[form.home]||{}} onStatus={setPlayerStatus(form.home)} onFetch={()=>doFetchRoster(form.home)} fetching={!!fetchingR[form.home]} delta={hDelta} cacheTs={rosterTs[form.home]}/>

            <div style={{background:"#FDFCFA",border:"1px solid #DDD8CF",borderRadius:4,padding:"10px 14px",marginBottom:10}}>

                  <textarea value={pdText} onChange={e=>setPdText(e.target.value)} placeholder='{"season":2026,"through_week":3,"units":{...},"players":{...}}' style={{...St.inp,width:"100%",minHeight:90,fontFamily:"Space Mono,monospace",fontSize:10}}/>
                  <button style={{...St.sm,marginTop:6,color:"#1A6E3C",borderColor:"#1A6E3C66"}} onClick={importPlayerData} disabled={!pdText.trim()}>LOAD</button>

              {playerData&&playerData.units&&playerData.units[form.home]&&playerData.units[form.away]&&(()=>{
                const lg=playerData.league_pressure_rate||0.247;const hu=playerData.units[form.home],au=playerData.units[form.away];
                const onHome=(lg+(au.R||0)+(hu.P||0))*100,onAway=(lg+(hu.R||0)+(au.P||0))*100;
                const top=t=>((playerData.players[t]||[]).filter(p=>p.p==="EDGE"||p.p==="DT").sort((a,b)=>b.idx-a.idx).slice(0,2).map(p=>p.n+" "+(p.idx>0?"+":"")+p.idx.toFixed(1)).join(", "));
                return(
                  <div style={{marginTop:8,fontFamily:"Space Mono,monospace",fontSize:10,color:"#5A7A90",lineHeight:1.7}}>

                    <div>{ABBR[form.away]} rush vs {ABBR[form.home]} OL: expected pressure <span style={{color:onHome>lg*100+3?"#C0392B":onHome<lg*100-3?"#1A6E3C":"#0A1F35",fontWeight:700}}>{onHome.toFixed(0)}%</span> (lg {(lg*100).toFixed(0)}%){hu.ol&&hu.ol.missing_last_week?" -- "+ABBR[form.home]+" OL missing "+hu.ol.missing_last_week+" usual starter(s)":""} -- top rushers: {top(form.away)||"n/a"}</div>

                    {(hu.espn||au.espn)&&<div style={{color:"#7A8E9A"}}>ESPN win rates{hu.P_espn!=null?" (blended 50/50 into units)":""}: {ABBR[form.away]} PRWR {au.espn&&au.espn.prwr!=null?au.espn.prwr+"%":"--"} / PBWR {au.espn&&au.espn.pbwr!=null?au.espn.pbwr+"%":"--"} -- {ABBR[form.home]} PRWR {hu.espn&&hu.espn.prwr!=null?hu.espn.prwr+"%":"--"} / PBWR {hu.espn&&hu.espn.pbwr!=null?hu.espn.pbwr+"%":"--"}</div>}
                    {hu.run&&au.run&&<div style={{color:"#7A8E9A"}}>RUN GAME (success rate, lg {(hu.run.league*100).toFixed(0)}%): {ABBR[form.away]} rush O {(au.run.rushO_succ*100).toFixed(0)}% vs {ABBR[form.home]} run D allows {(hu.run.rushD_succ*100).toFixed(0)}% -- {ABBR[form.home]} rush O {(hu.run.rushO_succ*100).toFixed(0)}% vs {ABBR[form.away]} run D allows {(au.run.rushD_succ*100).toFixed(0)}%{(hu.espn&&hu.espn.rbwr!=null)||(au.espn&&au.espn.rbwr!=null)?" -- ESPN RBWR "+ABBR[form.away]+" "+(au.espn&&au.espn.rbwr!=null?au.espn.rbwr+"%":"--")+" / "+ABBR[form.home]+" "+(hu.espn&&hu.espn.rbwr!=null?hu.espn.rbwr+"%":"--"):""}</div>}
                  </div>
                );
              })()}
            </div>

            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:2,marginBottom:10}}>
              <span style={{...St.lbl,marginBottom:0}}>GAME CONDITIONS (QB WX, 0.15/W)</span>
              {[["dome","DOME"],["hot","HOT 85F+"],["cold","COLD <32F"],["wind","WIND 15+"]].map(([k,lbl])=>(
                <button key={k} onClick={()=>{setGameWx(w=>({...w,[k]:!w[k]}));setManual(false);}} style={{background:gameWx[k]?"#D4AF3322":"transparent",border:"1px solid "+(gameWx[k]?"#E04500":"#DDD8CF"),color:gameWx[k]?"#E04500":"#7A8E9A",fontSize:9,padding:"4px 9px",borderRadius:3,cursor:"pointer",fontFamily:"Space Mono,monospace"}}>{lbl}</button>
              ))}

                    <span style={{fontFamily:"Space Mono,monospace",fontSize:11,color:"#7A8E9A"}}>{ABBR[form.away]} {modelOU.aPts} + {ABBR[form.home]} {modelOU.hPts}{modelOU.wx!==0?" wx "+(modelOU.wx>0?"+":"")+modelOU.wx:""}</span>
                    <span style={{fontFamily:"Space Mono,monospace",fontSize:16,fontWeight:900,color:"#0A1F35"}}>MODEL {modelOU.total}</span>

            <div style={St.lbl}>MY LINE <span style={{color:"#C8C0B0"}}>(auto)</span></div>

        </div>
        {["S","W","E"].map(cat=>(

            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {SWE.filter(f=>f.cat===cat).map(f=>{
                const on=sweOn[f.id];

                const who=fixed?null:(on==="h"?(form.home||"HOME"):on==="a"?(form.away||"AWAY"):null);
                const cycle=()=>setSweOn(s=>{

}

  const w=Math.floor((Date.now()-SEASON_START_2026.getTime())/(7*24*3600*1000))+1;

// -- RATINGS TAB --
function RatingsTab({ratings,setRatings}){
  const[home,setHome]=useState("");const[away,setAway]=useState("");
  const[hs,setHs]=useState("");const[as2,setAs]=useState("");
  const[hi,setHi]=useState(0);const[ai,setAi]=useState(0);
  const[log,setLog]=useState([]);
  const update=()=>{
    const hS=parseInt(hs),aS=parseInt(as2);
    if(!home||!away||isNaN(hS)||isNaN(aS))return;
    const hR=ratings[home]||0,aR=ratings[away]||0;
    const net=hS-aS;
    const hT=net+aR+(hi-ai)-HOME_ADV,aT=-net+hR+(ai-hi)+HOME_ADV;
    const nH=parseFloat((0.9*hR+0.1*hT).toFixed(2)),nA=parseFloat((0.9*aR+0.1*aT).toFixed(2));
    setRatings(r=>({...r,[home]:nH,[away]:nA}));
    setLog(l=>[{home,away,hS,aS,hR,aR,nH,nA},...l.slice(0,19)]);
    setHs("");setAs("");setHi(0);setAi(0);
  };
  const sorted=Object.entries(ratings).sort((a,b)=>b[1]-a[1]);
  const openingOf=t=>{const o=OPENING_2026.find(x=>x.t===t);return parseFloat(((DEFAULT_RATINGS[t]||0)*OPENING_SHRINK+(o?o.d:0)).toFixed(2));};
  const applyOpening=()=>{
    const next={};
    Object.keys(DEFAULT_RATINGS).forEach(t=>{next[t]=openingOf(t);});
    setRatings(next);
  };
  const openingApplied=Object.keys(DEFAULT_RATINGS).every(t=>Math.abs((ratings[t]||0)-openingOf(t))<0.001);
  return(
    <div style={{paddingBottom:40}}>
      <H2>2026 SEASON OPENING RATINGS</H2>
      <div style={{margin:"10px 20px 0",background:"#FFFFFF",border:"1px solid "+(openingApplied?"#1A6E3C44":"#E0450044"),borderRadius:4,padding:"16px 18px"}}>
        <div style={{color:"#7ABAE5",fontSize:12,lineHeight:1.6,marginBottom:10}}>
          End-2025 baseline x {OPENING_SHRINK} (11-season test: full carryover opens worse than a flat start; ratings need market-like dispersion), plus net offseason personnel value per the book.
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:12}}>
          {OPENING_2026.map(o=>(
            <div key={o.t} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:11,padding:"4px 0",borderBottom:"1px solid #F2EEE6",flexWrap:"wrap"}}>
              <span style={{color:"#1A3A5C"}}><span style={{fontFamily:"Space Mono,monospace",fontWeight:700,color:CLR[o.t]||"#5A7A90"}}>{ABBR[o.t]}</span> {o.why}</span>
              <span style={{fontFamily:"Space Mono,monospace",fontWeight:700,color:o.d>0?"#1A6E3C":"#C0392B"}}>{o.d>0?"+":""}{o.d}</span>
            </div>
          ))}
        </div>
        {openingApplied
          ?<div style={{color:"#1A6E3C",fontFamily:"Space Mono,monospace",fontSize:11,fontWeight:700}}>2026 OPENING RATINGS ACTIVE</div>
          :<button style={{...St.btn,padding:"11px"}} onClick={applyOpening}>APPLY 2026 OPENING RATINGS</button>}
      </div>

      <H2>BOTTOM-UP RATINGS -- FROM PLAYER DATA</H2>
      <div style={{margin:"10px 20px 0",background:"#FFFFFF",border:"1px solid #DDD8CF",borderRadius:4,padding:"16px 18px"}}>
        <div style={{color:"#7ABAE5",fontSize:12,lineHeight:1.6,marginBottom:10}}>
          Team rating built only from imported player data: starting QB index (3.48 pts/SD), pass-rush unit (41.9 pts/unit), protection unit (-22.6 pts/unit), rescaled to market-like dispersion. 2022-25 test: RMSE 13.2 vs top-down 12.7 vs market 12.2 -- worse as a base, offered so CLV and the info coefficient can judge it on your data.
        </div>
        {(()=>{const pd=loadPlayerData();const bu=pd?buildBottomUp(pd):null;
          if(!bu)return <div style={{fontFamily:"Space Mono,monospace",fontSize:10,color:"#C8C0B0"}}>Import player data in the Analyze tab first (player_pipeline.py output)</div>;
          const applied=Object.keys(bu).every(t=>Math.abs((ratings[t]||0)-bu[t])<0.001);
          return applied?<div style={{color:"#1A6E3C",fontFamily:"Space Mono,monospace",fontSize:11,fontWeight:700}}>BOTTOM-UP RATINGS ACTIVE ({pd.source} thru wk {pd.through_week})</div>
            :<button style={{...St.btn,padding:"11px"}} onClick={()=>setRatings(bu)}>APPLY BOTTOM-UP RATINGS ({pd.source} thru wk {pd.through_week})</button>;})()}
      </div>

      <H2>WEEKLY POWER RATING UPDATER</H2>

// -- RESULTS TAB (auto-grade + formula accuracy + rating updates) --
const RESULTS_INTERVAL_MS=6*3600*1000;
function gradeSide(margin,spread,side){
  // margin = home score - away score; spread = home favored by (home-margin space); side = "home"|"away"
  if(margin===spread)return "P";
  const homeCovers=margin>spread;
  return (side==="home")===homeCovers?"W":"L";
}
function betSideOf(rec){
  if(!rec)return null;
  const r=rec.toUpperCase();
  if(r.includes("NO BET"))return null;
  if(r.includes("TAKE HOME")||r.includes("FADE AWAY"))return "home";
  if(r.includes("TAKE AWAY")||r.includes("FADE HOME"))return "away";
  return null;
}
function gradeEntry(b,hs,as){
  const margin=hs-as,total=hs+as;
  const f={hs,as};
  const side=betSideOf(b.result?.recommendation);
  if(side){
    f.outcome=gradeSide(margin,parseFloat(b.game?.spread),side);
    const sz=b.betSize||0;
    f.pnl=f.outcome==="W"?sz:f.outcome==="L"?-Math.round(sz*1.1):0;
  }
  if(b.mech&&b.mech.side)f.mechOutcome=gradeSide(margin,parseFloat(b.game?.spread),b.mech.side);
  if(b.close!=null){
    f.clv=clvOf(side,parseFloat(b.game?.spread),b.close);
    f.clvMech=clvOf(b.mech&&b.mech.side,parseFloat(b.game?.spread),b.close);
    f.clvOu=clvOuOf(b.ouRec,parseFloat(b.game?.ou),b.closeOu);
  }
  const ou=(b.ouRec||"").toUpperCase();
  const line=parseFloat(b.game?.ou);
  if((ou==="OVER"||ou==="UNDER")&&!isNaN(line)){
    f.ouOutcome=total===line?"P":(total>line)===(ou==="OVER")?"W":"L";
    const sz=b.betSize||0;
    if(isBet(b)){f.ouPnl=f.ouOutcome==="W"?sz:f.ouOutcome==="L"?-Math.round(sz*1.1):0;}
  }
  return f;
}
function tgpl(hR,aR,hs,as,hi,ai,hfa){
  const net=hs-as;
  const hT=net+aR+(hi-ai)-hfa;
  const aT=-net+hR+(ai-hi)+hfa;
  return{nH:parseFloat((0.9*hR+0.1*hT).toFixed(2)),nA:parseFloat((0.9*aR+0.1*aT).toFixed(2))};
}
function ratingSuggestion(b,ratings,hfa){
  if(b.hs==null||b.as==null)return null;
  const hR=ratings[b.game?.home],aR=ratings[b.game?.away];
  if(hR==null||aR==null)return null;
  const net=b.hs-b.as;
  const hi=b.game?.hInjPts||0,ai=b.game?.aInjPts||0;
  const H=hfa!=null?hfa:HOME_ADV;
  const hT=net+aR+(hi-ai)-H;
  const aT=-net+hR+(ai-hi)+H;
  return{
    home:b.game.home,away:b.game.away,hR,aR,
    nH:parseFloat((0.9*hR+0.1*hT).toFixed(2)),
    nA:parseFloat((0.9*aR+0.1*aT).toFixed(2)),
  };
}

function gradeSlate(schedGames,finals,ratingsBefore,hfa,linesMap,history){
  const games=[];const next={...ratingsBefore};
  schedGames.forEach(s=>{
    const f=finals.find(x=>x.home===s.home&&x.away===s.away);
    if(!f)return;
    const hR=ratingsBefore[s.home],aR=ratingsBefore[s.away];
    if(hR==null||aR==null)return;
    const modelLine=parseFloat(((hR+hfa)-aR).toFixed(2));
    const ln=linesMap[s.home+"|"+s.away]||null;
    const close=ln&&ln.posted!=null?ln.posted:null;
    const open=ln&&ln.open!=null?ln.open:close;
    let stars=0,mechSide=null,mechOutcome=null;
    if(close!=null){
      const st=calcStars(modelLine,close);stars=parseFloat(st.stars);
      if(stars>=0.5){mechSide=modelLine>close?"home":modelLine<close?"away":null;if(mechSide)mechOutcome=gradeSide(f.hs-f.as,close,mechSide);}
    }
    const logged=history.find(b=>b.game&&b.game.home===s.home&&b.game.away===s.away);
    const hi=logged&&logged.game.hInjPts||0,ai=logged&&logged.game.aInjPts||0;
    const u=tgpl(hR,aR,f.hs,f.as,hi,ai,hfa);
    next[s.home]=u.nH;next[s.away]=u.nA;
    games.push({home:s.home,away:s.away,hs:f.hs,as:f.as,modelLine,close,open,ou:ln?ln.ou:null,stars,mechSide,mechOutcome,mechClv:clvOf(mechSide,open,close),neutral:false,hR,aR,nH:u.nH,nA:u.nA});
  });
  return{games,next};
}

function ScoreEntry({b,onSave}){

      <input style={{...St.inp,width:48,padding:"4px 6px",fontSize:11,fontFamily:"Space Mono,monospace"}} placeholder={ABBR[b.game.home]} value={h} onChange={e=>setH(e.target.value)}/>
      <button style={{...St.sm,fontSize:9,padding:"4px 8px",color:ok?"#1A6E3C":"#C8C0B0",borderColor:ok?"#1A6E3C66":"#DDD8CF"}} disabled={!ok} onClick={()=>onSave(parseInt(h),parseInt(a))}>SAVE</button>
    </div>

}

function AccCard({lbl,w,l,p}){
  const n=w+l;const pct=n?(w/n*100):null;const ci=wilson(w,n);
  return(
    <div style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:4,padding:"12px 14px"}}>
