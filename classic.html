        {pct!=null&&<span style={{fontFamily:"Space Mono,monospace",fontSize:13,fontWeight:700,color:pct>52.38?"#1A6E3C":"#C0392B"}}>{pct.toFixed(1)}%</span>}
        {ci&&<span style={{fontFamily:"Space Mono,monospace",fontSize:9,color:"#7A8E9A"}}>95% CI {ci[0].toFixed(0)}-{ci[1].toFixed(0)}%</span>}
      </div>
      {pct!=null&&<div style={{background:"#F8F6F2",borderRadius:4,height:6,overflow:"hidden",position:"relative",marginTop:8}}>
        <div style={{position:"absolute",left:"52.38%",top:0,bottom:0,width:2,background:"#E04500",zIndex:2}}/>
        {ci&&<div style={{position:"absolute",left:ci[0]+"%",width:(ci[1]-ci[0])+"%",top:0,bottom:0,background:"#0A1F3514"}}/>}
        <div style={{height:"100%",width:Math.min(pct,100)+"%",background:pct>52.38?"#1A6E3C":"#C0392B"}}/>
      </div>}
      {n>0&&n<50&&<div style={{fontFamily:"Space Mono,monospace",fontSize:9,color:"#C8C0B0",marginTop:4}}>n={n} -- interval too wide to conclude</div>}
    </div>
  );
}

function ResultsTab({history,onCommit,ratings,setRatings,calib,setCalib,slates,setSlates}){
  const hfa=hfaOf(calib);
  const[fetching,setFetching]=useState(false);
  const[err,setErr]=useState(null);
  const[last,setLast]=useState(()=>parseInt(localStorage.getItem("wnfl_results_last")||"0"));
  const[slateWk,setSlateWk]=useState(Math.max(1,currentNflWeek()-1));
  const[slateBusy,setSlateBusy]=useState(false);
  const[slateMsg,setSlateMsg]=useState(null);

  const graded=history.filter(b=>b.hs!=null);
  const pending=history.filter(b=>b.hs==null&&b.game&&b.game.home&&b.game.away&&!isNaN(parseFloat(b.game.spread)));

  const fetchScores=useCallback(async()=>{
    if(fetching||!pending.length)return;
    setFetching(true);setErr(null);
    try{
      const r=await fetchFinalsAPI(pending.map(b=>({home:b.game.home,away:b.game.away})));
      const commits=[];
      pending.forEach(b=>{
        const s=r.finals.find(x=>x.home===b.game.home&&x.away===b.game.away);
        if(s)commits.push({ts:b.ts,fields:gradeEntry(b,s.hs,s.as)});
      });
      if(commits.length)onCommit(commits);
      const now=Date.now();setLast(now);
      try{localStorage.setItem("wnfl_results_last",String(now));}catch{}
      if(!commits.length)setErr("No finals yet"+(r.dropped.length?" -- unrecognized names: "+r.dropped.join(", "):" -- games upcoming or in progress"));
    }catch(e){setErr(e.message);}finally{setFetching(false);}
  },[fetching,pending,onCommit]);

  useEffect(()=>{
    if(pending.length&&Date.now()-last>RESULTS_INTERVAL_MS)fetchScores();
  },[]);

  const manualScore=b=>(hs,as)=>{onCommit([{ts:b.ts,fields:gradeEntry(b,hs,as)}]);};

  // -- closing line capture: fetch current lines for pending games, store as close (latest sighting wins) --
  const[closing,setClosing]=useState(false);
  const captureClosers=async()=>{
    if(closing||!pending.length)return;setClosing(true);setErr(null);
    try{
      const r=await fetchRawLines();
      persistLines(r.lines);
      const commits=[];
      pending.forEach(b=>{
        const ln=r.lines.find(x=>x.home===b.game.home&&x.away===b.game.away);
        if(ln)commits.push({ts:b.ts,fields:{close:ln.posted,closeOu:ln.ou,closeTs:Date.now()}});
      });
      if(commits.length)onCommit(commits);
      setSlateMsg("Closing lines captured for "+commits.length+" of "+pending.length+" pending games"+(r.dropped.length?" -- dropped: "+r.dropped.join(", "):""));
    }catch(e){setErr("Closers: "+e.message);}finally{setClosing(false);}
  };
  // CLV pools: bets (AI side) and model picks; positive = beat the closer
  const clvBets=history.filter(b=>isBet(b)&&b.clv!=null);
  const clvMech=history.filter(b=>b.clvMech!=null);
  const clvOu=history.filter(b=>b.clvOu!=null);
  const clvStat=arr=>{if(!arr.length)return null;const v=arr.map(x=>x);const m=v.reduce((a,x)=>a+x,0)/v.length;const pos=v.filter(x=>x>0).length,neg=v.filter(x=>x<0).length;const sd=Math.sqrt(v.reduce((a,x)=>a+(x-m)*(x-m),0)/Math.max(1,v.length-1));return{m:parseFloat(m.toFixed(2)),n:v.length,pos,neg,se:parseFloat((sd/Math.sqrt(v.length)).toFixed(2))};};
  const cB=clvStat(clvBets.map(b=>b.clv)),cM=clvStat(clvMech.map(b=>b.clvMech)),cO=clvStat(clvOu.map(b=>b.clvOu));

  // -- weekly slate grading: every game, all 32 ratings --
  const slateFor=wk=>(slates||[]).find(s=>s.wk===wk);
  const latestGraded=(slates||[]).reduce((m,s)=>Math.max(m,s.wk),0);
  const gradeWeek=async()=>{
    if(slateBusy)return;setSlateBusy(true);setSlateMsg(null);setErr(null);
    try{
      const existing=slateFor(slateWk);
      if(existing&&slateWk<latestGraded)throw new Error("Week "+slateWk+" already graded and later weeks exist -- only the latest week can be re-graded");
      let sched=null;
      try{sched=JSON.parse(localStorage.getItem("wsched26_"+slateWk));}catch{}
      let dropped=[];
      if(!sched||!sched.length){const r=await fetchScheduleAPI(slateWk);sched=r.games;dropped=r.dropped;try{localStorage.setItem("wsched26_"+slateWk,JSON.stringify(sched));}catch{}}
      if(!sched.length)throw new Error("No schedule for week "+slateWk);
      const fr=await fetchFinalsAPI(sched.map(g=>({home:g.home,away:g.away})));
      dropped=dropped.concat(fr.dropped);
      if(!fr.finals.length)throw new Error("No finals found for week "+slateWk);
      let linesMap={};try{linesMap=JSON.parse(localStorage.getItem("wlines26_"+slateWk)||"{}");}catch{}
      const ratingsBefore=existing?existing.ratingsBefore:{...ratings};
      const{games,next}=gradeSlate(sched,fr.finals,ratingsBefore,hfa,linesMap,history);
      const rec={wk:slateWk,ts:Date.now(),ratingsBefore,games,dropped,nSched:sched.length};
      setSlates(ss=>[...(ss||[]).filter(x=>x.wk!==slateWk),rec].sort((a,b)=>a.wk-b.wk));
      setRatings(next);
      // grade any logged entries for these games too
      const commits=[];
      history.filter(b=>b.hs==null&&b.game).forEach(b=>{const s=fr.finals.find(x=>x.home===b.game.home&&x.away===b.game.away);if(s){const ln=linesMap[b.game.home+"|"+b.game.away];const bb=(b.close==null&&ln&&ln.posted!=null)?{...b,close:ln.posted,closeOu:ln.ou}:b;commits.push({ts:b.ts,fields:{...gradeEntry(bb,s.hs,s.as),...(bb.close!=null&&b.close==null?{close:bb.close,closeOu:bb.closeOu}:{})}});}});
      if(commits.length)onCommit(commits);
      const missing=sched.length-games.length;
      setSlateMsg("Week "+slateWk+": "+games.length+" games graded, "+(Object.keys(next).filter(t=>next[t]!==ratingsBefore[t]).length)+" ratings updated"+(missing?", "+missing+" not final yet":"")+(dropped.length?" -- DROPPED: "+dropped.join(", "):""));
    }catch(e){setErr(e.message);}finally{setSlateBusy(false);}
  };

  // accuracy pools
  const mechA=graded.filter(b=>b.mechOutcome);
  const mW=mechA.filter(b=>b.mechOutcome==="W").length,mL=mechA.filter(b=>b.mechOutcome==="L").length,mP=mechA.filter(b=>b.mechOutcome==="P").length;
  const slateGames=(slates||[]).flatMap(s=>s.games).filter(g=>g.mechOutcome);
  const sW=slateGames.filter(g=>g.mechOutcome==="W").length,sL=slateGames.filter(g=>g.mechOutcome==="L").length,sP=slateGames.filter(g=>g.mechOutcome==="P").length;
  const aiA=graded.filter(b=>b.outcome);
  const aW=aiA.filter(b=>b.outcome==="W").length,aL=aiA.filter(b=>b.outcome==="L").length,aP=aiA.filter(b=>b.outcome==="P").length;
  const ouA=graded.filter(b=>b.ouOutcome);
  const oW=ouA.filter(b=>b.ouOutcome==="W").length,oL=ouA.filter(b=>b.ouOutcome==="L").length,oP=ouA.filter(b=>b.ouOutcome==="P").length;
  const anyAcc=(mW+mL+sW+sL+aW+aL+oW+oL)>0;

  const applyRating=b=>{
    const s=ratingSuggestion(b,ratings,hfa);
    if(!s)return;
    setRatings(r=>({...r,[s.home]:s.nH,[s.away]:s.nA}));
    onCommit([{ts:b.ts,fields:{ratingApplied:true}}]);
  };

  const ageH=last?Math.floor((Date.now()-last)/3600000):null;
  const cur=slateFor(slateWk);
  return(
    <div style={{paddingBottom:40}}>
      <div style={{margin:"16px 20px 0",background:"#F8F6F2",border:"1px solid #1f2937",borderRadius:4,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{color:"#E04500",fontSize:10,letterSpacing:3,fontFamily:"Space Mono,monospace"}}>AUTO RESULTS -- 6H CYCLE</div>
          <div style={{color:"#7A8E9A",fontSize:11,marginTop:3}}>{pending.length} awaiting scores -- {graded.length} graded{ageH!=null?" -- last fetch "+(ageH<1?"under 1h":ageH+"h")+" ago":""}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button style={{...St.sm,color:"#1A6E3C",borderColor:"#1A6E3C66",padding:"9px 14px"}} onClick={captureClosers} disabled={closing||!pending.length}>{closing?"CAPTURING...":"CAPTURE CLOSING LINES"}</button>
          <button style={{...St.sm,color:"#E04500",borderColor:"#E0450030",background:"#FB4F1411",padding:"9px 16px"}} onClick={fetchScores} disabled={fetching||!pending.length}>{fetching?"FETCHING...":"FETCH NOW"}</button>
        </div>
      </div>
      {err&&<div style={{...St.err,margin:"8px 20px 0"}}>{err}</div>}

      {(cB||cM||cO)&&(
        <><H2>CLOSING LINE VALUE -- THE SCOREBOARD</H2>
        <div style={{margin:"8px 20px 0",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
          {[["YOUR BETS (AI SIDE)",cB],["MODEL PICKS",cM],["O/U TAKES",cO]].filter(([l,c])=>c).map(([l,c])=>(
            <div key={l} style={{background:"#FFFFFF",border:"1px solid "+(c.m>0?"#1A6E3C44":"#1a1a1a"),borderRadius:4,padding:"12px 14px"}}>
              <div style={{color:"#C8C0B0",fontSize:9,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>{l}</div>
              <div style={{display:"flex",gap:10,alignItems:"baseline",marginTop:4,flexWrap:"wrap"}}>
                <span style={{fontFamily:"Space Mono,monospace",fontSize:17,fontWeight:700,color:c.m>0?"#1A6E3C":c.m<0?"#C0392B":"#0A1F35"}}>{c.m>0?"+":""}{c.m} pts</span>
                <span style={{fontFamily:"Space Mono,monospace",fontSize:10,color:"#7A8E9A"}}>avg CLV, n={c.n}, +/-{c.se}</span>
              </div>
              <div style={{fontFamily:"Space Mono,monospace",fontSize:10,color:"#7A8E9A",marginTop:4}}>beat closer {c.pos} / lost to closer {c.neg} / flat {c.n-c.pos-c.neg}</div>
              <div style={{fontSize:10,color:c.n>=30?(c.m>0.5?"#1A6E3C":c.m>0?"#7A8E9A":"#C0392B"):"#C8C0B0",marginTop:4}}>{c.n<30?"need 30+ for a read":c.m>0.5?"consistent edge signal":c.m>0?"slight edge, keep sampling":"market moves against you -- lines are not sharper than the book"}</div>
            </div>
          ))}
        </div>
        <div style={{margin:"6px 20px 0",color:"#7A8E9A",fontSize:10}}>CLV = closing line minus your line, from your side. +1.0 means the number you bet closed a full point better. Independent of who covered -- converges in weeks, not seasons.</div></>
      )}

      <H2>WEEKLY SLATE -- GRADE ALL, UPDATE ALL 32</H2>
      <div style={{margin:"8px 20px 0",background:"#FFFFFF",border:"1px solid #FB4F1422",borderRadius:4,padding:"14px 16px"}}>
        <div style={{color:"#7ABAE5",fontSize:12,lineHeight:1.5,marginBottom:10}}>Walters re-rates every team every week. Grading the full slate applies TGPL to all 32 (injury diffs from your analyses where available) and feeds calibration with unbiased model-vs-market data.</div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button style={{...St.sm,padding:"6px 10px"}} onClick={()=>setSlateWk(w=>Math.max(1,w-1))}>-</button>
          <span style={{fontFamily:"Space Mono,monospace",fontSize:13,fontWeight:700,color:"#0A1F35",minWidth:70,textAlign:"center"}}>WEEK {slateWk}</span>
          <button style={{...St.sm,padding:"6px 10px"}} onClick={()=>setSlateWk(w=>Math.min(18,w+1))}>+</button>
          <button style={{...St.sm,color:"#E04500",borderColor:"#E0450030",background:"#FB4F1411",padding:"9px 16px"}} onClick={gradeWeek} disabled={slateBusy}>{slateBusy?"GRADING...":cur?"RE-GRADE WEEK "+slateWk:"GRADE WEEK "+slateWk}</button>
          {cur&&<span style={{fontFamily:"Space Mono,monospace",fontSize:10,color:"#1A6E3C"}}>graded {cur.games.length}/{cur.nSched}{cur.games.filter(g=>g.close!=null).length?" -- "+cur.games.filter(g=>g.close!=null).length+" with closing lines":" -- no closing lines cached (fetch Alerts during game week)"}</span>}
        </div>
        {slateMsg&&<div style={{color:"#1A6E3C",fontSize:11,marginTop:8,fontFamily:"Space Mono,monospace"}}>{slateMsg}</div>}
        {cur&&cur.games.length>0&&(
          <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:3}}>
            {cur.games.map(g=>(
              <div key={g.home+g.away} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:11,padding:"4px 0",borderTop:"1px solid #F2EEE6",flexWrap:"wrap"}}>
                <span style={{color:"#1A3A5C"}}>{ABBR[g.away]} {g.as} @ {ABBR[g.home]} {g.hs}</span>
                <span style={{fontFamily:"Space Mono,monospace",fontSize:10,color:"#7A8E9A"}}>model {g.modelLine>0?"+":""}{g.modelLine}{g.close!=null?" / mkt "+(g.close>0?"+":"")+g.close:""} -- {ABBR[g.home]} {g.hR>=0?"+":""}{g.hR} to {g.nH>=0?"+":""}{g.nH}{g.mechOutcome?<span style={{color:g.mechOutcome==="W"?"#1A6E3C":g.mechOutcome==="L"?"#C0392B":"#7ABAE5",fontWeight:700}}> {g.stars}* {g.mechOutcome}</span>:null}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <H2>CALIBRATION -- LEARNED FROM RESULTS</H2>
      <div style={{margin:"8px 20px 0",background:"#FFFFFF",border:"1px solid "+(calib&&calib.on?"#1A6E3C44":"#DDD8CF"),borderRadius:4,padding:"14px 16px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:8,marginBottom:10}}>
          {[["HOME FIELD",(hfa).toFixed(2)+" pts",(calib&&calib.hfaAdj?((calib.hfaAdj>0?"+":"")+calib.hfaAdj+" learned"):"book 2.0"),"n="+(calib?calib.nHfa:0)+" slate games"],
            ["O/U SCALAR","x"+(calib?calib.ouScalar:1),(calib&&calib.nOu?"actual/model totals":"default 1.0"),"n="+(calib?calib.nOu:0)+" analyzed"],
            ["QB MULTIPLIER",(calib&&calib.nQb>=5?calib.qbMult:1)+"x",(calib&&calib.nQb>=5?"min-error fit":"needs 5 QB-injury games"),"n="+(calib?calib.nQb:0)],
            ["INFO COEFFICIENT",(calib&&calib.ic!=null)?calib.ic.toFixed(2):"--",(calib&&calib.ic!=null)?(calib.ic>0.3?"disagreement is informative":calib.ic>0.1?"weak signal":"disagreement = noise, stars are not bets"):"needs 8 slate games w/ closing lines","n="+(calib?calib.nIc:0)+" (11-yr hist 0.02, oracle 0.77)"]].map(([l,v,sub,n])=>(
            <div key={l} style={{background:"#F8F6F2",border:"1px solid #1a1a1a",borderRadius:3,padding:"10px 12px"}}>
              <div style={{color:"#C8C0B0",fontSize:9,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>{l}</div>
              <div style={{fontFamily:"Space Mono,monospace",fontSize:15,fontWeight:700,color:"#0A1F35",marginTop:3}}>{v}</div>
              <div style={{fontSize:10,color:"#7A8E9A"}}>{sub}</div>
              <div style={{fontFamily:"Space Mono,monospace",fontSize:9,color:"#C8C0B0"}}>{n}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button style={{...St.sm,color:calib&&calib.on?"#1A6E3C":"#7A8E9A",borderColor:calib&&calib.on?"#1A6E3C66":"#DDD8CF"}} onClick={()=>setCalib(c=>({...c,on:!c.on}))}>{calib&&calib.on?"LEARNED CALIBRATION: ON":"LEARNED CALIBRATION: OFF"}</button>
          <span style={{color:"#7A8E9A",fontSize:10}}>Priors from 11 seasons (2,544 games): HFA 2.0 and TGPL 0.9 are optimal, prior weight {CALIB_PRIOR_N}. Historical star-play ATS: {Object.entries(HIST_STARS).sort((a,b)=>parseFloat(a[0])-parseFloat(b[0])).map(([s,h])=>s+"* "+h.p+"%").join(", ")} -- stars measure market disagreement; they only pay when the info coefficient is positive.</span>
        </div>
      </div>

      {anyAcc&&(
        <><H2>FORMULA ACCURACY vs 52.4%</H2>
        <div style={{margin:"8px 20px 0",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
          <AccCard lbl="MODEL vs MARKET -- FULL SLATE" w={sW} l={sL} p={sP}/>
          <AccCard lbl="MODEL PICKS -- ANALYZED GAMES" w={mW} l={mL} p={mP}/>
          <AccCard lbl="AI RECS -- ANALYZED GAMES" w={aW} l={aL} p={aP}/>
          <AccCard lbl="O/U TAKES" w={oW} l={oL} p={oP}/>
        </div></>
      )}

      {graded.length>0&&(
        <><H2>COMPLETED -- {graded.length}</H2>
        <div style={{margin:"8px 20px 0",display:"flex",flexDirection:"column",gap:6}}>
          {graded.map(b=>{
            const margin=b.hs-b.as,sp=parseFloat(b.game.spread);
            const sug=b.ratingApplied?null:ratingSuggestion(b,ratings,hfa);
            const inSlate=(slates||[]).some(s=>s.games.some(g=>g.home===b.game.home&&g.away===b.game.away));
            return(
              <div key={b.ts} style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:3,padding:"11px 14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"center"}}>
                  <div>
                    <div style={{color:"#1A3A5C",fontSize:13,fontWeight:600}}>{b.game.away} {b.as} @ {b.game.home} {b.hs}</div>
                    <div style={{color:"#7A8E9A",fontSize:10,fontFamily:"Space Mono,monospace",marginTop:3}}>
                      margin {margin>0?"+":""}{margin} vs line {sp>0?"+":""}{sp} -- {b.result?.recommendation||""}{b.mech&&b.mech.side?" / model "+b.mech.side.toUpperCase()+" "+b.mech.stars+"*":""}{b.ouRec&&b.ouRec!=="NO BET"?" / "+b.ouRec+" "+b.game.ou:""}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                    {b.clv!=null&&<Tag t={"CLV "+(b.clv>0?"+":"")+b.clv} c={b.clv>0?"#1A6E3C":b.clv<0?"#C0392B":"#7ABAE5"}/>}
                    {b.mechOutcome&&<Tag t={"MODEL "+b.mechOutcome} c={b.mechOutcome==="W"?"#1A6E3C":b.mechOutcome==="L"?"#C0392B":"#7ABAE5"}/>}
                    {b.outcome&&<Tag t={"AI "+b.outcome} c={b.outcome==="W"?"#1A6E3C":b.outcome==="L"?"#C0392B":"#7ABAE5"}/>}
                    {b.ouOutcome&&<Tag t={"O/U "+b.ouOutcome} c={b.ouOutcome==="W"?"#1A6E3C":b.ouOutcome==="L"?"#C0392B":"#7ABAE5"}/>}
                  </div>
                </div>
                {sug&&!inSlate&&(
                  <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #F2EEE6",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                    <span style={{fontFamily:"Space Mono,monospace",fontSize:10,color:"#7A8E9A"}}>
                      TGPL: {ABBR[sug.home]} {sug.hR>=0?"+":""}{sug.hR} to <span style={{color:sug.nH>sug.hR?"#1A6E3C":"#C0392B"}}>{sug.nH>=0?"+":""}{sug.nH}</span> -- {ABBR[sug.away]} {sug.aR>=0?"+":""}{sug.aR} to <span style={{color:sug.nA>sug.aR?"#1A6E3C":"#C0392B"}}>{sug.nA>=0?"+":""}{sug.nA}</span>
                    </span>
                    <button style={{...St.sm,fontSize:9,color:"#1A6E3C",borderColor:"#1A6E3C66"}} onClick={()=>applyRating(b)}>APPLY RATING UPDATE</button>
                  </div>
                )}
                {inSlate&&!b.ratingApplied&&<div style={{marginTop:6,fontFamily:"Space Mono,monospace",fontSize:9,color:"#7A8E9A"}}>rated via weekly slate</div>}
                {b.ratingApplied&&<div style={{marginTop:6,fontFamily:"Space Mono,monospace",fontSize:9,color:"#1A6E3C"}}>RATINGS UPDATED</div>}
              </div>
            );
          })}
        </div></>
      )}

      {pending.length>0&&(
        <><H2>AWAITING SCORES -- {pending.length}</H2>
        <div style={{margin:"8px 20px 0",display:"flex",flexDirection:"column",gap:5}}>
          {pending.map(b=>(
            <div key={b.ts} style={{background:"#F8F6F2",border:"1px solid #E8E4DC",borderRadius:3,padding:"9px 14px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"center"}}>
              <div>
                <div style={{color:"#5A7A90",fontSize:12}}>{b.game.away} @ {b.game.home}</div>
                <div style={{color:"#C8C0B0",fontSize:10,fontFamily:"Space Mono,monospace"}}>{b.result?.recommendation||""}{b.close!=null?" -- bet "+(parseFloat(b.game.spread)>0?"+":"")+b.game.spread+" / close "+(b.close>0?"+":"")+b.close:" -- closer not captured"}</div>
              </div>
              <ScoreEntry b={b} onSave={manualScore(b)}/>
            </div>
          ))}
        </div></>
      )}

      {history.length===0&&(slates||[]).length===0&&(
        <div style={{textAlign:"center",padding:"40px 20px",color:"#C8C0B0",fontSize:13}}>Analyses auto-log to the pipeline -- finals get fetched and graded every 6 hours. Grade full weeks above to re-rate all 32 teams.</div>
      )}
    </div>
  );
}

// -- LOG & STATS TAB --
function LogTab({history,onUpdate}){
  // ATS stats -- over real bets only (NO BET analyses tracked separately in Results)
  const bets=history.filter(isBet);
  const W=bets.filter(h=>h.outcome==="W").length;
  const L=bets.filter(h=>h.outcome==="L").length;
  const P=bets.filter(h=>h.outcome==="P").length;
  const N=bets.length;
  const decided=W+L;
  const wr=decided?(W/decided*100).toFixed(1):0;
  const pnl=bets.reduce((a,b)=>a+(b.pnl||0),0);
  const wagered=bets.reduce((a,b)=>a+(b.betSize||0),0);
  const roi=wagered>0?((pnl/wagered)*100).toFixed(1):0;

  // O/U stats
  const ouBets=history.filter(b=>b.ouRec&&b.ouRec!=="NO BET"&&b.ouRec!=="no bet");
  const ouW=ouBets.filter(b=>b.ouOutcome==="W").length;
  const ouL=ouBets.filter(b=>b.ouOutcome==="L").length;
  const ouD=ouW+ouL;
  const ouWr=ouD>0?(ouW/ouD*100).toFixed(1):null;
  const ouPnl=ouBets.reduce((a,b)=>a+(b.ouPnl||0),0);

  const byStar=[3,2.5,2,1.5,1,0.5].map(s=>{
    const sb=bets.filter(b=>b.game?.stars===s);
    const w=sb.filter(b=>b.outcome==="W").length,l=sb.filter(b=>b.outcome==="L").length;
    const p=sb.reduce((a,b)=>a+(b.pnl||0),0);
    return{s,n:sb.length,w,l,wr:(w+l)?(w/(w+l)*100).toFixed(0):"-",pnl:p};
  }).filter(x=>x.n>0);

  return(
    <div style={{paddingBottom:40}}>
      <H2>PERFORMANCE DASHBOARD</H2>
      <div style={{margin:"10px 20px 0",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
        {[["RECORD",W+"-"+L+(P?"-"+P:""),W>L?"#1A6E3C":W<L?"#C0392B":"#7ABAE5"],["WIN RATE",wr+"%",parseFloat(wr)>52.38?"#1A6E3C":"#C0392B"],["BREAK-EVEN","52.4%","#7A8E9A"],["P&L",pnl>=0?"+$"+pnl.toLocaleString():"-$"+Math.abs(pnl).toLocaleString(),pnl>=0?"#1A6E3C":"#C0392B"],["ROI",roi+"%",parseFloat(roi)>0?"#1A6E3C":"#C0392B"],["BETS",N,"#E04500"]].map(([l,v,c])=>(
          <div key={l} style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:4,padding:"12px 14px",textAlign:"center"}}>
            <div style={{color:"#C8C0B0",fontSize:9,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>{l}</div>
            <div style={{color:c,fontSize:17,fontWeight:700,fontFamily:"Space Mono,monospace",marginTop:4}}>{v}</div>
          </div>
        ))}
      </div>

      {ouBets.length>0&&(
        <div style={{margin:"8px 20px 0",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:4,padding:"12px 14px",textAlign:"center"}}>
            <div style={{color:"#C8C0B0",fontSize:9,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>O/U RECORD</div>
            <div style={{color:ouW>ouL?"#1A6E3C":ouW<ouL?"#C0392B":"#7ABAE5",fontSize:17,fontWeight:700,fontFamily:"Space Mono,monospace",marginTop:4}}>{ouW}-{ouL}</div>
            {ouWr&&<div style={{color:parseFloat(ouWr)>52.38?"#1A6E3C":"#C0392B",fontSize:11,fontFamily:"Space Mono,monospace",marginTop:2}}>{ouWr}%</div>}
          </div>
          <div style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:4,padding:"12px 14px",textAlign:"center"}}>
            <div style={{color:"#C8C0B0",fontSize:9,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>O/U P&L</div>
            <div style={{color:ouPnl>=0?"#1A6E3C":"#C0392B",fontSize:17,fontWeight:700,fontFamily:"Space Mono,monospace",marginTop:4}}>{ouPnl>=0?"+$":"-$"}{Math.abs(ouPnl).toLocaleString()}</div>
          </div>
        </div>
      )}

      {N>0&&(
        <div style={{margin:"10px 20px 0",background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:4,padding:"12px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{color:"#7A8E9A",fontSize:10,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>WIN RATE vs 52.4% BREAK-EVEN</span>
            <span style={{color:parseFloat(wr)>52.38?"#1A6E3C":"#C0392B",fontSize:11,fontFamily:"Space Mono,monospace",fontWeight:700}}>{wr}%</span>
          </div>
          <div style={{background:"#F8F6F2",borderRadius:4,height:8,overflow:"hidden",position:"relative"}}>
            <div style={{position:"absolute",left:"52.38%",top:0,bottom:0,width:2,background:"#E04500",zIndex:2}}/>
            <div style={{height:"100%",width:Math.min(parseFloat(wr)||0,100)+"%",background:parseFloat(wr)>52.38?"#1A6E3C":"#C0392B",borderRadius:4,transition:"width 0.8s ease"}}/>
          </div>
        </div>
      )}

      {byStar.length>0&&(
        <><H2>BY STAR RATING</H2>
        <div style={{margin:"8px 20px 0",display:"flex",flexDirection:"column",gap:5}}>
          {byStar.map(({s,n,w,l,wr:wr2,pnl:p})=>(
            <div key={s} style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:3,padding:"10px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <Stars s={s}/><span style={{color:"#5A7A90",fontFamily:"Space Mono,monospace",fontSize:12,minWidth:55}}>{s} star</span>
              <span style={{color:"#7A8E9A",fontSize:11}}>{n} bets</span>
              <span style={{color:"#5A7A90",fontFamily:"Space Mono,monospace",fontSize:11}}>{w}W-{l}L</span>
              <span style={{color:parseFloat(wr2)>52?"#1A6E3C":"#C0392B",fontFamily:"Space Mono,monospace",fontSize:12,fontWeight:700}}>{wr2}%</span>
              <span style={{color:p>=0?"#1A6E3C":"#C0392B",fontFamily:"Space Mono,monospace",fontSize:12,marginLeft:"auto"}}>{p>=0?"+":"-"}${Math.abs(p).toLocaleString()}</span>
            </div>
          ))}
        </div></>
      )}

      <H2>BET LOG</H2>
      {history.length===0?(
        <div style={{color:"#DDD8CF",textAlign:"center",padding:"30px",fontSize:13}}>Nothing yet. Every analysis auto-logs here -- bets count toward P&L, NO BET games track formula accuracy.</div>
      ):(
        <div style={{margin:"8px 20px 0",display:"flex",flexDirection:"column",gap:5}}>
          {history.map((b,i)=>(
            <div key={i} style={{background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:3,padding:"11px 14px",opacity:isBet(b)?1:0.55,borderLeft:isBet(b)?"1px solid #1a1a1a":"3px solid #C8C0B0"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
                <div style={{flex:1,minWidth:180}}>
                  <div style={{color:"#1A3A5C",fontSize:13,fontWeight:600}}>{b.game?.away} @ {b.game?.home}</div>
                  <div style={{display:"flex",gap:8,marginTop:3,alignItems:"center",flexWrap:"wrap"}}>
                    <Stars s={b.game?.stars||0}/><span style={{color:"#C8C0B0",fontSize:11}}>{b.result?.recommendation}</span>
                    <span style={{color:"#DDD8CF",fontFamily:"Space Mono,monospace",fontSize:11}}>${(b.betSize||0).toLocaleString()}</span>
                    {b.game?.ou&&<span style={{color:"#C8C0B0",fontSize:11,fontFamily:"Space Mono,monospace"}}>o/u {b.game.ou}</span>}
                  </div>
                </div>
              </div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                {isBet(b)&&<div style={{display:"flex",gap:3,alignItems:"center"}}>
                  <span style={{fontSize:10,fontFamily:"Space Mono,monospace",color:"#7A8E9A",marginRight:2}}>ATS</span>
                  {b.outcome&&<span style={{color:b.outcome==="W"?"#1A6E3C":b.outcome==="L"?"#C0392B":"#7ABAE5",fontFamily:"Space Mono,monospace",fontSize:11,fontWeight:700,marginRight:4}}>{b.outcome==="W"?"+$"+b.betSize:b.outcome==="L"?"-$"+Math.round(b.betSize*1.1):"PUSH"}</span>}
                  {["W","L","P"].map(o=>(
                    <button key={o} onClick={()=>onUpdate(i,o,"outcome")} style={{background:b.outcome===o?(o==="W"?"#D1FAE533":o==="L"?"#FEE2E233":"#F3F4F633"):"transparent",border:"1px solid "+(b.outcome===o?(o==="W"?"#1A6E3C":o==="L"?"#C0392B":"#7ABAE5"):"#DDD8CF"),color:b.outcome===o?(o==="W"?"#1A6E3C":o==="L"?"#C0392B":"#7ABAE5"):"#C8C0B0",width:28,height:28,borderRadius:3,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"Space Mono,monospace"}}>{o}</button>
                  ))}
                </div>}
                {b.ouRec&&b.ouRec!=="NO BET"&&b.ouRec!=="no bet"&&(
                  <div style={{display:"flex",gap:3,alignItems:"center"}}>
                    <span style={{fontSize:10,fontFamily:"Space Mono,monospace",color:"#7A8E9A",marginRight:2}}>O/U ({b.ouRec})</span>
                    {b.ouOutcome&&<span style={{color:b.ouOutcome==="W"?"#1A6E3C":b.ouOutcome==="L"?"#C0392B":"#7ABAE5",fontFamily:"Space Mono,monospace",fontSize:11,fontWeight:700,marginRight:4}}>{b.ouOutcome==="W"?"+$"+b.betSize:b.ouOutcome==="L"?"-$"+Math.round(b.betSize*1.1):"PUSH"}</span>}
                    {["W","L","P"].map(o=>(
                      <button key={o} onClick={()=>onUpdate(i,o,"ouOutcome")} style={{background:b.ouOutcome===o?(o==="W"?"#D1FAE533":o==="L"?"#FEE2E233":"#F3F4F633"):"transparent",border:"1px solid "+(b.ouOutcome===o?(o==="W"?"#1A6E3C":o==="L"?"#C0392B":"#7ABAE5"):"#DDD8CF"),color:b.ouOutcome===o?(o==="W"?"#1A6E3C":o==="L"?"#C0392B":"#7ABAE5"):"#C8C0B0",width:28,height:28,borderRadius:3,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"Space Mono,monospace"}}>{o}</button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// -- BANKROLL BAR --
function BkBar({bankroll,setBankroll,unit,setUnit,history}){
  const bets=history.filter(isBet);
  const W=bets.filter(h=>h.outcome==="W").length,L=bets.filter(h=>h.outcome==="L").length;
  const pnl=bets.reduce((a,b)=>a+(b.pnl||0),0);
  const wr=(W+L)?(W/(W+L)*100).toFixed(1):null;
  return(
    <div style={{margin:"0 20px",background:"#FFFFFF",border:"1px solid #1a1a1a",borderRadius:4,padding:"12px 18px",display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-end"}}>
      {[["BANKROLL ($)",bankroll,setBankroll],["UNIT ($)",unit,setUnit]].map(([lbl,val,fn])=>(
        <div key={lbl} style={{flex:1,minWidth:120}}>
          <div style={St.lbl}>{lbl}{lbl.includes("UNIT")&&bankroll?<span style={{color:"#C8C0B0"}}> = {((unit/bankroll)*100).toFixed(1)}%</span>:null}</div>
          <input style={{...St.inp,fontFamily:"Space Mono,monospace",fontWeight:700,fontSize:14}} type="number" value={val} onChange={e=>fn(+e.target.value)}/>
        </div>
      ))}
      {[[W+"-"+L,"RECORD",W>L?"#1A6E3C":W<L?"#C0392B":"#7ABAE5"],[wr?wr+"%":"--","WIN RATE",wr&&parseFloat(wr)>52.38?"#1A6E3C":"#C0392B"],[pnl>=0?"+$"+pnl.toLocaleString():"-$"+Math.abs(pnl).toLocaleString(),"P&L",pnl>=0?"#1A6E3C":"#C0392B"]].map(([v,l,c])=>(
        <div key={l} style={{textAlign:"center",minWidth:65}}>
          <div style={{color:"#C8C0B0",fontSize:9,letterSpacing:2,fontFamily:"Space Mono,monospace"}}>{l}</div>
          <div style={{color:c,fontSize:15,fontWeight:700,fontFamily:"Space Mono,monospace",marginTop:2}}>{v}</div>
        </div>
      ))}
    </div>
  );
}

// -- SETTINGS TAB (standalone/deployed builds only) --
function SettingsTab(){
  const[akey,setAkey]=useState(()=>localStorage.getItem("wnfl_akey")||"");
  const[okey,setOkey]=useState(()=>localStorage.getItem("oapi")||"");
  const[saved,setSaved]=useState(false);
  const save=()=>{
    try{localStorage.setItem("wnfl_akey",akey.trim());if(okey.trim())localStorage.setItem("oapi",okey.trim());else localStorage.removeItem("oapi");}catch{}
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  return(
    <div style={{paddingBottom:40}}>
      <H2>API KEYS</H2>
      <div style={{margin:"10px 20px 0",background:"#FFFFFF",border:"1px solid #FB4F1422",borderRadius:4,padding:"18px"}}>
        <div style={{marginBottom:14}}>
          <div style={St.lbl}>ANTHROPIC API KEY (required -- powers rosters, lines, analysis, results)</div>
          <input style={{...St.inp,fontFamily:"Space Mono,monospace"}} type="password" placeholder="sk-ant-..." value={akey} onChange={e=>setAkey(e.target.value)}/>
          <div style={{color:"#7A8E9A",fontSize:11,marginTop:4}}>Get one at console.anthropic.com -- stored only in this browser (localStorage)</div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={St.lbl}>THE ODDS API KEY (optional -- per-book lines in Alerts)</div>
          <input style={{...St.inp,fontFamily:"Space Mono,monospace"}} type="password" placeholder="Free key from theoddsapi.com" value={okey} onChange={e=>setOkey(e.target.value)}/>
          <div style={{color:"#7A8E9A",fontSize:11,marginTop:4}}>With a key, Alerts pulls DK/FD/Caesars/MGM directly; without one it uses Claude web search</div>
        </div>
        <button style={St.btn} onClick={save}>SAVE KEYS</button>
        {saved&&<div style={{color:"#1A6E3C",fontSize:12,marginTop:8,fontFamily:"Space Mono,monospace"}}>SAVED</div>}
      </div>
    </div>
  );
}

// -- MAIN --
function App(){
  const[tab,setTab]=useState("alerts");
  const[bankroll,setBankroll]=useState(10000);
  const[unit,setUnit]=useState(100);
  const[history,setHistory]=useState(()=>{try{return JSON.parse(localStorage.getItem("wnfl_log"))||[];}catch{return[];}});
  const[ratings,setRatings]=useState(()=>{try{return JSON.parse(localStorage.getItem("wnfl_ratings"))||{...DEFAULT_RATINGS};}catch{return{...DEFAULT_RATINGS};}});
  const[prefill,setPrefill]=useState(null);

  const[slates,setSlates]=useState(()=>{try{return JSON.parse(localStorage.getItem("wnfl_slates"))||[];}catch{return[];}});
  const[calib,setCalib]=useState(()=>{try{return{...CALIB_DEFAULT,...(JSON.parse(localStorage.getItem("wnfl_calib"))||{})};}catch{return{...CALIB_DEFAULT};}});
  const[qbMode,setQbMode]=useState(()=>localStorage.getItem("wnfl_qbmode")||"1");

  useEffect(()=>{try{localStorage.setItem("wnfl_log",JSON.stringify(history));}catch{}},[history]);
  useEffect(()=>{try{localStorage.setItem("wnfl_ratings",JSON.stringify(ratings));}catch{}},[ratings]);
  useEffect(()=>{try{localStorage.setItem("wnfl_slates",JSON.stringify(slates));}catch{}},[slates]);
  useEffect(()=>{try{localStorage.setItem("wnfl_calib",JSON.stringify(calib));}catch{}},[calib]);
  useEffect(()=>{try{localStorage.setItem("wnfl_qbmode",qbMode);}catch{}},[qbMode]);
  // re-learn calibration whenever graded data changes
  useEffect(()=>{setCalib(prev=>computeCalibration(slates,history,prev));},[slates,history]);

  const pick=g=>{setPrefill(g);setTab("analyze");};
  // upsert: re-analyzing a matchup replaces its ungraded entry instead of duplicating
  const logBet=bet=>setHistory(h=>{
    const i=h.findIndex(b=>b.game?.home===bet.game?.home&&b.game?.away===bet.game?.away&&b.outcome==null&&b.ouOutcome==null);
    if(i>=0){const c=[...h];c[i]=bet;return c;}
    return[bet,...h];
  });
  const commitScores=commits=>setHistory(h=>h.map(b=>{
    const c=commits.find(x=>x.ts===b.ts);
    return c?{...b,...c.fields}:b;
  }));
  const updOut=(i,o,field="outcome")=>setHistory(h=>h.map((b,idx)=>{
    if(idx!==i)return b;
    if(field==="outcome"){
      const p=o==="W"?b.betSize:o==="L"?-(b.betSize*1.1):0;
      return{...b,outcome:b.outcome===o?null:o,pnl:b.outcome===o?0:p};
    }
    if(field==="ouOutcome"){
      const p=o==="W"?b.betSize:o==="L"?-(b.betSize*1.1):0;
      return{...b,ouOutcome:b.ouOutcome===o?null:o,ouPnl:b.ouOutcome===o?0:p};
    }
    return b;
  }));

  const STANDALONE=typeof window!=="undefined"&&window.WALTERS_STANDALONE;
  const TABS=[["alerts","ALERTS"],["analyze","ANALYZE"],["results","RESULTS"],["schedule","SCHEDULE"],["ratings","RATINGS"],["log","LOG & STATS"],...(STANDALONE?[["settings","SETTINGS"]]:[])];

  return(
    <div style={{background:"#F4F1EC",minHeight:"100vh",color:"#0A1F35",fontFamily:"Source Sans 3,sans-serif",maxWidth:860,margin:"0 auto"}}>
      <div style={{background:"linear-gradient(135deg,#001C30 0%,#00111E 55%,#1A0800 100%)",borderBottom:"1px solid #1A3A5C",padding:"22px 24px 18px",display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{color:"#8A9EAE",fontSize:9,letterSpacing:5,marginBottom:6,fontFamily:"Space Mono,monospace"}}>SPORTS BETTING INTELLIGENCE</div>
          <h1 style={{margin:0,fontSize:34,fontWeight:700,letterSpacing:6,color:"#ffffff",fontFamily:"Oswald,sans-serif",lineHeight:1}}>WALTERS<span style={{color:"#E04500"}}> SYSTEM</span></h1>
          <div style={{color:"#8A9EAE",fontSize:11,marginTop:4}}>Live odds -- Edge detection -- Power ratings -- Line movement -- Analytics</div>
        </div>
        <div style={{textAlign:"right",borderLeft:"1px solid #1A3A5C",paddingLeft:18}}>
          <div style={{color:"#E04500",fontSize:10,letterSpacing:3}}>BREAK-EVEN</div>
          <div style={{color:"#fff",fontSize:24,fontWeight:900,fontFamily:"Space Mono,monospace"}}>52.4%</div>
          <div style={{color:"#C8C0B0",fontSize:10}}>required win rate</div>
        </div>
      </div>

      <div style={{display:"flex",borderBottom:"1px solid #1a1a1a",background:"#FFFFFF",padding:"0 16px",overflowX:"auto",borderBottom:"1px solid #E8E4DC"}}>
        {TABS.map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:"transparent",border:"none",borderBottom:"3px solid "+(tab===id?"#E04500":"transparent"),color:tab===id?"#E04500":"#8A9EAE",background:"transparent",fontSize:11,letterSpacing:2,padding:"12px 14px",cursor:"pointer",fontFamily:"Space Mono,monospace",fontWeight:700,whiteSpace:"nowrap"}}>
            {lbl}
          </button>
        ))}
      </div>

      {["analyze","log"].includes(tab)&&(
        <div style={{padding:"12px 0 0"}}>
          <BkBar bankroll={bankroll} setBankroll={setBankroll} unit={unit} setUnit={setUnit} history={history}/>
        </div>
      )}

      {tab==="alerts"   &&<AlertsTab ratings={ratings} onPick={pick} calib={calib}/>}
      {tab==="analyze"  &&<AnalyzeTab ratings={ratings} bankroll={bankroll} unit={unit} onLog={logBet} prefill={prefill} calib={calib} qbMode={qbMode} setQbMode={setQbMode}/>}
      {tab==="results"  &&<ResultsTab history={history} onCommit={commitScores} ratings={ratings} setRatings={setRatings} calib={calib} setCalib={setCalib} slates={slates} setSlates={setSlates}/>}
      {tab==="schedule" &&<ScheduleTab ratings={ratings} calib={calib}/>}
      {tab==="ratings"  &&<RatingsTab ratings={ratings} setRatings={setRatings}/>}
      {tab==="log"      &&<LogTab history={history} onUpdate={updOut}/>}
      {tab==="settings" &&<SettingsTab/>}

      <EthFooter />
    </div>
  );
}

if(typeof document!=="undefined"){
  const s=document.createElement("style");
  s.textContent=`
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseOrange{0%,100%{box-shadow:0 0 0 0 rgba(251,79,20,0.15)}50%{box-shadow:0 0 0 4px rgba(251,79,20,0)}}
  * {-webkit-font-smoothing:antialiased;}
  select option{background:#001C30;color:#E8F4FF;}
  select:focus,input:focus{outline:none;border-color:#FB4F14 !important;box-shadow:0 0 0 2px rgba(251,79,20,0.12);}
  input[type=range]{height:4px;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{width:18px;height:18px;background:#FB4F14;border:3px solid #001C30;box-shadow:0 0 4px rgba(251,79,20,0.5);}
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:#00111E;}
  ::-webkit-scrollbar-thumb{background:#FB4F1444;border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:#FB4F1466;}
  button:active{transform:scale(0.97);}
`; 
  document.head.appendChild(s);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
